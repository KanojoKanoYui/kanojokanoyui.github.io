<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanojoKanoYui</title>
  <meta name="description" content="Coming soon...">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff9f5;
      --bg-card: #ffffff;
      --pink: #ff8fab;
      --pink-deep: #ff6b9d;
      --pink-soft: #ffd0dc;
      --green: #7ec8a3;
      --green-soft: #c8e6d0;
      --cream: #fff3e0;
      --sky: #a8d8ff;
      --text: #5a4545;
      --text-soft: #8a7373;
      --line: #f0d4d8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* soft sky + ground atmosphere */
    .sky {
      position: fixed;
      inset: 0;
      background: linear-gradient(180deg, #e8f4ff 0%, var(--bg) 55%, #fff0e8 100%);
      z-index: 0;
    }

    /* decorative circles (soft blobs like illustration style) */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(50px);
      opacity: 0.5;
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 {
      width: 320px; height: 320px;
      background: var(--pink-soft);
      top: -100px; left: -80px;
      animation: drift 14s ease-in-out infinite;
    }
    .blob-2 {
      width: 260px; height: 260px;
      background: var(--green-soft);
      bottom: -80px; right: -60px;
      animation: drift 18s ease-in-out infinite reverse;
    }
    .blob-3 {
      width: 160px; height: 160px;
      background: #ffe8b0;
      top: 30%; right: 8%;
      animation: drift 11s ease-in-out infinite 1s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(18px, -14px); }
    }

    /* tiny decorative dots */
    .dot {
      position: fixed;
      width: 6px; height: 6px;
      background: var(--pink);
      border-radius: 50%;
      opacity: 0.55;
      z-index: 0;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .dot:nth-child(1) { top: 16%; left: 18%; }
    .dot:nth-child(2) { top: 24%; right: 16%; animation-delay: 0.7s; width: 5px; height: 5px; }
    .dot:nth-child(3) { bottom: 20%; left: 12%; animation-delay: 1.3s; }
    .dot:nth-child(4) { bottom: 28%; right: 20%; animation-delay: 1.9s; width: 4px; height: 4px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.35); }
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 1.5rem;
      text-align: center;
    }

    /* character-inspired badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: white;
      border: 2px solid var(--pink-soft);
      border-radius: 999px;
      padding: 0.3rem 0.95rem;
      font-size: 0.82rem;
      color: var(--pink-deep);
      font-weight: 500;
      margin-bottom: 1.6rem;
      box-shadow: 0 4px 16px rgba(255, 139, 171, 0.15);
    }
    .badge span {
      font-size: 0.95rem;
    }

    h1 {
      font-size: clamp(2.2rem, 9vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.15;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    h1 .accent {
      color: var(--pink-deep);
    }

    .kana {
      font-size: 1.05rem;
      color: var(--text-soft);
      letter-spacing: 0.12em;
      margin-bottom: 1.8rem;
      font-weight: 500;
    }

    /* main card - rounded like chibi silhouette */
    .card {
      background: var(--bg-card);
      border-radius: 28px;
      padding: 2rem 1.6rem 1.8rem;
      border: 2px solid var(--line);
      box-shadow: 0 14px 40px rgba(255, 139, 171, 0.12);
      position: relative;
    }

    /* little top accent like a collar / ribbon */
    .card::before {
      content: "";
      position: absolute;
      top: -9px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 7px;
      background: linear-gradient(90deg, var(--pink), var(--green));
      border-radius: 999px;
    }

    .msg-jp {
      font-size: 1.2rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: var(--text);
    }

    .msg-en {
      font-size: 0.9rem;
      color: var(--text-soft);
      letter-spacing: 0.02em;
      margin-bottom: 1.5rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      background: #fff0f3;
      border-radius: 999px;
      padding: 0.4rem 1.05rem;
      font-size: 0.88rem;
      color: var(--pink-deep);
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: var(--pink-deep);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .deco {
      margin-top: 1.3rem;
      font-size: 1rem;
      letter-spacing: 0.35rem;
      opacity: 0.65;
      color: var(--pink);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 2.2rem;
      font-size: 0.78rem;
      color: var(--text-soft);
      letter-spacing: 0.04em;
    }

    @media (max-width: 420px) {
      .wrap { padding: 1.2rem; }
      .card { padding: 1.6rem 1.3rem 1.5rem; border-radius: 24px; }
    }
  </style>
</head>
<body>
  <div class="sky"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>
  <div class="dot"></div>

  <main class="wrap">
    <div class="badge">
      <span>♡</span> Coming Soon
    </div>

    <h1><span class="accent">Kanojo</span>KanoYui</h1>
    <p class="kana">かのじょかのゆい</p>

    <div class="card">
      <p class="msg-jp">ただいま準備中です ♡</p>
      <p class="msg-en">This little page is still growing...</p>

      <div class="status">
        <span class="status-dot"></span>
        <span>準備中</span>
      </div>

      <div class="deco">✿ ♡ ✿</div>
    </div>
  </main>

  <footer>© 2026 KanojoKanoYui</footer>
</body>
</html>
