<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanojoKanoYui</title>
  <meta name="description" content="Coming soon...">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff8f2;
      --card: #ffffff;
      --pink: #ff8fab;
      --pink-deep: #f06292;
      --pink-soft: #ffcdd8;
      --green: #7bc47f;
      --green-soft: #c8e6c9;
      --yellow: #ffd54f;
      --sky: #b3e5fc;
      --text: #5d4037;
      --text-soft: #8d6e63;
      --line: #f8bbd0;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    /* soft sky gradient like the illustration */
    .atmosphere {
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        #e3f2fd 0%,
        #fce4ec 40%,
        #fff8f2 70%,
        #fff3e0 100%
      );
      z-index: 0;
    }

    /* soft floating blobs inspired by sunflower field light */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(55px);
      opacity: 0.45;
      z-index: 0;
      pointer-events: none;
    }
    .blob-pink {
      width: 300px; height: 300px;
      background: var(--pink-soft);
      top: -90px; left: -70px;
      animation: float 13s ease-in-out infinite;
    }
    .blob-green {
      width: 240px; height: 240px;
      background: var(--green-soft);
      bottom: -70px; right: -50px;
      animation: float 16s ease-in-out infinite reverse;
    }
    .blob-yellow {
      width: 150px; height: 150px;
      background: #ffe082;
      top: 35%; right: 6%;
      animation: float 11s ease-in-out infinite 1.5s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(16px, -12px); }
    }

    /* tiny sparkles */
    .spark {
      position: fixed;
      width: 6px; height: 6px;
      background: var(--pink);
      border-radius: 50%;
      opacity: 0.5;
      z-index: 0;
      animation: twinkle 2.6s ease-in-out infinite;
    }
    .spark:nth-child(1) { top: 14%; left: 16%; }
    .spark:nth-child(2) { top: 22%; right: 14%; animation-delay: 0.6s; width: 5px; height: 5px; }
    .spark:nth-child(3) { bottom: 18%; left: 11%; animation-delay: 1.2s; }
    .spark:nth-child(4) { bottom: 26%; right: 18%; animation-delay: 1.8s; width: 4px; height: 4px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.4); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 1.5rem;
      text-align: center;
    }

    /* character area - centered like the composition */
    .character-area {
      margin-bottom: 1.6rem;
      position: relative;
    }

    .character-frame {
      width: 180px;
      height: 180px;
      margin: 0 auto;
      border-radius: 50%;
      background: linear-gradient(145deg, #fff 0%, #fff0f5 100%);
      border: 3px solid var(--pink-soft);
      box-shadow: 0 12px 32px rgba(240, 98, 146, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* simple CSS chibi face as placeholder until real art is added */
    .chibi {
      width: 120px;
      height: 120px;
      position: relative;
    }

    .chibi-hair {
      width: 110px;
      height: 70px;
      background: #f5f5f5;
      border-radius: 55px 55px 20px 20px;
      position: absolute;
      top: 0;
      left: 5px;
      border: 2.5px solid #e0e0e0;
    }

    .chibi-face {
      width: 78px;
      height: 78px;
      background: #fff8f0;
      border-radius: 50%;
      position: absolute;
      top: 28px;
      left: 21px;
      border: 2.5px solid #e8d5c8;
    }

    .chibi-glasses {
      position: absolute;
      top: 48px;
      left: 28px;
      width: 64px;
      height: 22px;
      border: 2.5px solid #f48fb1;
      border-radius: 12px;
      background: transparent;
    }

    .chibi-eye {
      position: absolute;
      width: 12px;
      height: 14px;
      background: #42a5f5;
      border-radius: 50%;
      top: 52px;
    }
    .chibi-eye.left { left: 38px; }
    .chibi-eye.right { right: 38px; left: auto; }

    .chibi-mouth {
      position: absolute;
      width: 8px;
      height: 4px;
      border-bottom: 2px solid #e57373;
      border-radius: 0 0 8px 8px;
      top: 72px;
      left: 56px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      background: white;
      border: 2px solid var(--pink-soft);
      border-radius: 999px;
      padding: 0.28rem 0.9rem;
      font-size: 0.8rem;
      color: var(--pink-deep);
      font-weight: 500;
      margin-bottom: 1.2rem;
      box-shadow: 0 4px 14px rgba(240, 98, 146, 0.12);
    }

    h1 {
      font-size: clamp(2rem, 8vw, 2.7rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 0.25rem;
    }
    h1 .pink { color: var(--pink-deep); }

    .kana {
      font-size: 0.98rem;
      color: var(--text-soft);
      letter-spacing: 0.14em;
      margin-bottom: 1.5rem;
      font-weight: 500;
    }

    .card {
      background: var(--card);
      border-radius: 26px;
      padding: 1.7rem 1.4rem 1.5rem;
      border: 2px solid var(--line);
      box-shadow: 0 12px 36px rgba(240, 98, 146, 0.1);
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 52px;
      height: 6px;
      background: linear-gradient(90deg, var(--pink), var(--green));
      border-radius: 999px;
    }

    .msg-jp {
      font-size: 1.15rem;
      font-weight: 500;
      margin-bottom: 0.25rem;
    }

    .msg-en {
      font-size: 0.88rem;
      color: var(--text-soft);
      margin-bottom: 1.3rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #fff0f3;
      border-radius: 999px;
      padding: 0.38rem 1rem;
      font-size: 0.86rem;
      color: var(--pink-deep);
      font-weight: 500;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--pink-deep);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.75); }
    }

    .flowers {
      margin-top: 1.1rem;
      font-size: 1.05rem;
      letter-spacing: 0.3rem;
      opacity: 0.7;
      color: var(--pink);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 2rem;
      font-size: 0.76rem;
      color: var(--text-soft);
      letter-spacing: 0.04em;
    }

    @media (max-width: 400px) {
      .page { padding: 1.1rem; }
      .character-frame { width: 150px; height: 150px; }
      .card { padding: 1.4rem 1.2rem; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <div class="atmosphere"></div>
  <div class="blob blob-pink"></div>
  <div class="blob blob-green"></div>
  <div class="blob blob-yellow"></div>

  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>

  <main class="page">
    <div class="badge">♡ Coming Soon</div>

    <!-- centered character area inspired by the composition -->
    <div class="character-area">
      <div class="character-frame">
        <div class="chibi">
          <div class="chibi-hair"></div>
          <div class="chibi-face"></div>
          <div class="chibi-glasses"></div>
          <div class="chibi-eye left"></div>
          <div class="chibi-eye right"></div>
          <div class="chibi-mouth"></div>
        </div>
      </div>
    </div>

    <h1><span class="pink">Kanojo</span>KanoYui</h1>
    <p class="kana">かのじょかのゆい</p>

    <div class="card">
      <p class="msg-jp">ただいま準備中です ♡</p>
      <p class="msg-en">This little page is still growing...</p>

      <div class="status">
        <span class="status-dot"></span>
        <span>準備中</span>
      </div>

      <div class="flowers">✿ ♡ ✿</div>
    </div>
  </main>

  <footer>© 2026 KanojoKanoYui</footer>
</body>
</html>
