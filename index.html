<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KanojoKanoYui</title>
  <meta name="description" content="Coming soon... ♡">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff9f7;
      --pink: #ff8fab;
      --pink-deep: #ff6b9d;
      --pink-soft: #ffc2d1;
      --pink-pale: #ffe4ec;
      --green: #7ec8a3;
      --green-soft: #b8e0c8;
      --lavender: #d4c1ff;
      --cream: #fff5eb;
      --text: #5a4545;
      --text-soft: #8c7575;
      --line: #3a3a3a;
      --skin: #f8f0e8;
      --hair: #f2f2f2;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: 'Zen Maru Gothic', 'M PLUS Rounded 1c', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
      padding: 1.5rem 1rem 2rem;
    }

    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.48;
      z-index: 0;
      pointer-events: none;
    }
    .blob-1 {
      width: 360px; height: 360px;
      background: var(--pink-soft);
      top: -110px; left: -130px;
      animation: drift 14s ease-in-out infinite;
    }
    .blob-2 {
      width: 280px; height: 280px;
      background: var(--green-soft);
      bottom: -90px; right: -90px;
      animation: drift 17s ease-in-out infinite reverse;
    }
    .blob-3 {
      width: 180px; height: 180px;
      background: var(--lavender);
      top: 42%; left: 6%;
      animation: drift 11s ease-in-out infinite 1.2s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(16px, -20px) scale(1.04); }
    }

    .spark {
      position: fixed;
      width: 7px; height: 7px;
      background: var(--pink);
      border-radius: 50%;
      opacity: 0.55;
      z-index: 0;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .spark:nth-child(1) { top: 13%; left: 17%; }
    .spark:nth-child(2) { top: 21%; right: 13%; animation-delay: 0.6s; width: 5px; height: 5px; }
    .spark:nth-child(3) { bottom: 17%; left: 11%; animation-delay: 1.2s; width: 6px; height: 6px; }
    .spark:nth-child(4) { bottom: 25%; right: 19%; animation-delay: 1.8s; }
    .spark:nth-child(5) { top: 36%; right: 7%; animation-delay: 0.35s; width: 4px; height: 4px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.45); }
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    /* Character - closer to the provided illustration */
    .stage {
      width: 200px;
      height: 240px;
      margin: 0 auto 1.4rem;
      position: relative;
    }

    .chibi {
      width: 160px;
      height: 230px;
      margin: 0 auto;
      position: relative;
    }

    /* Hair */
    .hair-back {
      position: absolute;
      top: 2px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px;
      height: 92px;
      background: var(--hair);
      border: 2.5px solid var(--line);
      border-radius: 60% 60% 42% 42%;
      z-index: 1;
    }

    .hair-side-l, .hair-side-r {
      position: absolute;
      top: 48px;
      width: 34px;
      height: 52px;
      background: var(--hair);
      border: 2.5px solid var(--line);
      z-index: 1;
    }
    .hair-side-l {
      left: 12px;
      border-radius: 0 0 40% 70%;
      border-right: none;
    }
    .hair-side-r {
      right: 12px;
      border-radius: 0 0 70% 40%;
      border-left: none;
    }

    /* Head */
    .head {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 104px;
      height: 96px;
      background: var(--skin);
      border: 2.5px solid var(--line);
      border-radius: 50% 50% 46% 46%;
      z-index: 3;
    }

    /* Bangs */
    .bangs {
      position: absolute;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: 96px;
      height: 34px;
      background: var(--hair);
      border-radius: 0 0 50% 50%;
      z-index: 4;
      border-bottom: 2px solid var(--line);
    }

    /* Glasses */
    .glasses {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      width: 76px;
      height: 26px;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .lens {
      width: 30px;
      height: 26px;
      border: 3px solid #e88aa8;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      position: relative;
    }
    .lens::after {
      content: "";
      position: absolute;
      top: 5px;
      left: 6px;
      width: 7px;
      height: 7px;
      background: #4fc3f7;
      border-radius: 50%;
      box-shadow: 11px 2px 0 #4fc3f7;
    }
    .bridge {
      width: 8px;
      height: 3px;
      background: #e88aa8;
    }

    /* Body / Dress */
    .body {
      position: absolute;
      top: 108px;
      left: 50%;
      transform: translateX(-50%);
      width: 88px;
      height: 72px;
      background: var(--pink);
      border: 2.5px solid var(--line);
      border-radius: 14px 14px 20px 20px;
      z-index: 2;
    }
    .collar {
      position: absolute;
      top: -5px;
      left: 50%;
      transform: translateX(-50%);
      width: 44px;
      height: 13px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 18px;
      z-index: 3;
    }

    /* Bag */
    .bag {
      position: absolute;
      top: 118px;
      left: 16px;
      width: 34px;
      height: 26px;
      background: var(--green);
      border: 2px solid var(--line);
      border-radius: 9px;
      z-index: 4;
      transform: rotate(-14deg);
    }
    .bag::before {
      content: "";
      position: absolute;
      top: -12px;
      left: 9px;
      width: 14px;
      height: 14px;
      border: 2.5px solid var(--line);
      border-bottom: none;
      border-radius: 50% 50% 0 0;
    }

    /* Bouquet */
    .bouquet {
      position: absolute;
      top: 112px;
      right: 10px;
      width: 46px;
      height: 50px;
      z-index: 5;
    }
    .flower {
      position: absolute;
      width: 15px;
      height: 15px;
      background: #ff8fab;
      border: 1.5px solid var(--line);
      border-radius: 50%;
    }
    .flower:nth-child(1) { top: 0; left: 14px; }
    .flower:nth-child(2) { top: 7px; left: 0; background: #ffb3c6; }
    .flower:nth-child(3) { top: 5px; right: 0; background: #ff9eb5; }
    .flower:nth-child(4) { top: 16px; left: 12px; background: #ffc2d1; }
    .stem {
      position: absolute;
      bottom: 2px;
      left: 20px;
      width: 3px;
      height: 26px;
      background: var(--green);
      border-radius: 2px;
    }

    /* Legs & shoes */
    .legs {
      position: absolute;
      top: 176px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 26px;
      display: flex;
      justify-content: space-between;
      z-index: 1;
    }
    .leg {
      width: 20px;
      height: 26px;
      background: var(--skin);
      border: 2px solid var(--line);
      border-radius: 7px;
    }

    .shoes {
      position: absolute;
      top: 198px;
      left: 50%;
      transform: translateX(-50%);
      width: 72px;
      height: 18px;
      display: flex;
      justify-content: space-between;
      z-index: 2;
    }
    .shoe {
      width: 32px;
      height: 16px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 9px 9px 5px 5px;
    }

    /* Text */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      background: #fff;
      border: 2px solid var(--pink-soft);
      border-radius: 999px;
      padding: 0.28rem 0.9rem;
      font-size: 0.8rem;
      color: var(--pink-deep);
      font-weight: 500;
      margin-bottom: 0.9rem;
      box-shadow: 0 4px 12px rgba(255, 139, 171, 0.14);
    }

    h1 {
      font-size: clamp(1.85rem, 7vw, 2.5rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
      margin-bottom: 0.2rem;
    }
    h1 .accent {
      background: linear-gradient(120deg, var(--pink-deep), #c9a0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .kana {
      font-size: 0.92rem;
      color: var(--text-soft);
      letter-spacing: 0.12em;
      margin-bottom: 1.35rem;
      font-weight: 500;
    }

    .card {
      background: #fff;
      border-radius: 22px;
      padding: 1.4rem 1.3rem 1.25rem;
      box-shadow: 0 10px 30px rgba(255, 139, 171, 0.12);
      border: 1.5px solid var(--pink-pale);
      position: relative;
    }
    .card::before {
      content: "";
      position: absolute;
      top: -7px;
      left: 50%;
      transform: translateX(-50%);
      width: 48px;
      height: 5px;
      background: linear-gradient(90deg, var(--pink), var(--green));
      border-radius: 999px;
    }

    .msg-jp {
      font-size: 1.08rem;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }
    .msg-en {
      font-size: 0.86rem;
      color: var(--text-soft);
      margin-bottom: 1.15rem;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: var(--pink-pale);
      border-radius: 999px;
      padding: 0.38rem 0.95rem;
      font-size: 0.84rem;
      color: var(--pink-deep);
      font-weight: 500;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: var(--pink-deep);
      border-radius: 50%;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .hearts {
      margin-top: 0.95rem;
      font-size: 0.95rem;
      letter-spacing: 0.35rem;
      opacity: 0.7;
      color: var(--pink);
    }

    footer {
      position: relative;
      z-index: 1;
      margin-top: 1.8rem;
      font-size: 0.76rem;
      color: var(--text-soft);
      letter-spacing: 0.04em;
    }

    @media (max-width: 400px) {
      .stage { width: 170px; height: 210px; }
      .chibi { transform: scale(0.9); transform-origin: top center; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>
  <div class="spark"></div>

  <main class="page">
    <div class="stage">
      <div class="chibi">
        <div class="hair-back"></div>
        <div class="hair-side-l"></div>
        <div class="hair-side-r"></div>
        <div class="head">
          <div class="bangs"></div>
          <div class="glasses">
            <div class="lens"></div>
            <div class="bridge"></div>
            <div class="lens"></div>
          </div>
        </div>
        <div class="body"><div class="collar"></div></div>
        <div class="bag"></div>
        <div class="bouquet">
          <div class="stem"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
          <div class="flower"></div>
        </div>
        <div class="legs">
          <div class="leg"></div>
          <div class="leg"></div>
        </div>
        <div class="shoes">
          <div class="shoe"></div>
          <div class="shoe"></div>
        </div>
      </div>
    </div>

    <div class="badge">Coming Soon ♡</div>

    <h1><span class="accent">Kanojo</span>KanoYui</h1>
    <p class="kana">かのじょかのゆい</p>

    <div class="card">
      <p class="msg-jp">ただいま準備中です ♡</p>
      <p class="msg-en">This page is under construction.</p>

      <div class="status">
        <span class="dot"></span>
        <span>準備中 / Working on it</span>
      </div>

      <div class="hearts">♡ ✦ ♡</div>
    </div>
  </main>

  <footer>© 2026 KanojoKanoYui</footer>
</body>
</html>
